<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Management System</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Book Management System</h1>
        <p class="subtitle">Manage your books and their prices</p>

        <!-- Book Form -->
        <div class="form-container">

            <h2>Add a Book</h2>

            <form id="bookForm">

                <div class="form-group">
                    <label for="bookName">Book Name</label>
                    <input
                        type="text"
                        id="bookName"
                        placeholder="Enter book name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="bookPrice">Book Price (₹)</label>
                    <input
                        type="number"
                        id="bookPrice"
                        placeholder="Enter book price"
                        min="0.01"
                        step="0.01"
                        required
                    >
                </div>

                <button type="submit" id="submitBtn">
                    Add Book
                </button>

                <button type="button" id="cancelBtn" hidden>
                    Cancel Edit
                </button>

            </form>

        </div>

        <!-- Book Table -->
        <div class="table-container">

            <h2>Book List</h2>

            <table>

                <thead>
                    <tr>
                        <th>Sr. No.</th>
                        <th>Book Name</th>
                        <th>Price</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="bookTableBody">
                    <!-- JavaScript inserts rows here -->
                </tbody>

            </table>

            <p id="emptyMessage">No books added yet.</p>

        </div>

        <!-- Summary -->
        <div class="summary">

            <div class="summary-card">
                <h3>Total Books</h3>
                <p id="totalBooks">0</p>
            </div>

            <div class="summary-card">
                <h3>Total Price</h3>
                <p id="totalPrice">₹0.00</p>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
